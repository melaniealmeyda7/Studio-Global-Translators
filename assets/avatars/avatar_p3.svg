<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF" />
      <stop offset="50%" stop-color="#FCE7F3" />
      <stop offset="100%" stop-color="#CCFBF1" />
    </linearGradient>
  </defs>
  
  <!-- Circular Background -->
  <circle cx="100" cy="100" r="98" fill="url(#bgGrad)" stroke="#E2E8F0" stroke-width="2" />
  
  <!-- Subtle inner ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 4" opacity="0.8" />
  
  <!-- Female Translator Silhouette / Icon -->
  <g transform="translate(100, 92)" text-anchor="middle">
    <!-- Hair -->
    <path d="M-32,-20 C-36,-45 -16,-65 0,-65 C16,-65 36,-45 32,-20 C40,-15 42,-5 38,10 C34,25 24,35 15,38 C8,40 0,40 -8,40 C-17,40 -25,32 -34,20 C-40,6 -36,-12 -32,-20 Z" fill="#334155" />
    
    <!-- Face -->
    <path d="M-18,-15 C-20,-30 -8,-42 0,-42 C8,-42 20,-30 18,-15 C18,0 12,15 0,16 C-12,15 -18,0 -18,-15 Z" fill="#FED7AA" />
    
    <!-- Shoulders & Blazer -->
    <path d="M-55,68 C-52,42 -35,28 -15,24 L0,38 L15,24 C35,28 52,42 55,68 Z" fill="#475569" />
    
    <!-- Inner Shirt / Blouse -->
    <path d="M-15,24 L0,48 L15,24 Z" fill="#FFFFFF" />
  </g>
  
  <!-- Badge: UNIFÉ Translator -->
  <rect x="30" y="152" width="140" height="26" rx="13" fill="#FFFFFF" opacity="0.95" />
  <text x="100" y="169" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#7C3AED" text-anchor="middle" letter-spacing="0.5">SOPHIA C. • UNIFÉ</text>
</svg>
